<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a4a" />
      <stop offset="100%" stop-color="#070e1b" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="105" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="6" />

  <!-- Microchip Pins Top & Bottom -->
  <g fill="url(#gold)">
    <rect x="130" y="30" width="16" height="36" rx="4" />
    <rect x="180" y="30" width="16" height="36" rx="4" />
    <rect x="230" y="30" width="16" height="36" rx="4" />
    <rect x="280" y="30" width="16" height="36" rx="4" />
    <rect x="330" y="30" width="16" height="36" rx="4" />
    <rect x="130" y="446" width="16" height="36" rx="4" />
    <rect x="180" y="446" width="16" height="36" rx="4" />
    <rect x="230" y="446" width="16" height="36" rx="4" />
    <rect x="280" y="446" width="16" height="36" rx="4" />
    <rect x="330" y="446" width="16" height="36" rx="4" />
  </g>

  <!-- Circuit Traces -->
  <g stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4" fill="none">
    <path d="M 60 160 L 110 160 L 140 210" />
    <path d="M 60 350 L 110 350 L 140 300" />
    <path d="M 450 256 L 380 256" />
    <circle cx="60" cy="160" r="7" fill="#00f0ff" />
    <circle cx="60" cy="350" r="7" fill="#00f0ff" />
    <circle cx="450" cy="256" r="8" fill="#00ff88" filter="url(#glow)" />
  </g>

  <!-- Central IC Body -->
  <rect x="100" y="90" width="312" height="332" rx="28" fill="#10253f" stroke="#00a8cc" stroke-width="5" />
  <rect x="115" y="105" width="282" height="302" rx="20" fill="#0c1d32" stroke="#16385a" stroke-width="3" />

  <!-- Logic Gate Symbol (D-shape AND + NOT Bubble) -->
  <g filter="url(#glow)">
    <!-- AND Gate Path -->
    <path d="M 180 180 L 250 180 A 76 76 0 0 1 250 332 L 180 332 Z" fill="#143456" stroke="url(#neonCyan)" stroke-width="10" />
    
    <!-- NOT Bubble Inverter -->
    <circle cx="346" cy="256" r="18" fill="#0c1d32" stroke="url(#neonCyan)" stroke-width="8" />

    <!-- Input Pins -->
    <line x1="130" y1="215" x2="180" y2="215" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />
    <line x1="130" y1="297" x2="180" y2="297" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />

    <!-- Output Pin with Pulse -->
    <line x1="364" y1="256" x2="420" y2="256" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Central Ampersand/Symbol & Status LED -->
  <text x="230" y="275" font-family="monospace" font-size="52" font-weight="bold" fill="#00ff88" text-anchor="middle">&amp;</text>
  <circle cx="415" cy="256" r="12" fill="#00ff88" filter="url(#glow)" />
  <circle cx="415" cy="256" r="6" fill="#ffffff" />
</svg>
