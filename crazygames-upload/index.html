<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA & Mobile Fullscreen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gate Plumber" />
  <meta name="application-name" content="Logic Gate Plumber" />
  <meta name="theme-color" content="#070e1b" />
  <meta name="description" content="Logic Gate Plumber - Game giải đố xoay cổng logic số trên di động" />

  <!-- App Icons & Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <title>Logic Gate Plumber - Nối Mạch Kỹ Thuật Số</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070e1b;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      image-rendering: auto;
    }
    
    
    
    
    @media (max-width: 600px) {
      
    
    
    }
  </style>
  <script type="module" crossorigin src="./assets/index-n1R4QP4N.js"></script>
</head>
<body>
  
  
  <div id="game-container"></div>
  <script>
    // Hide APK download button and QR button if running inside native Android App (Capacitor), iframe (CrazyGames), or standalone mode
    (function() {
      function detectAndHideOnNative() {
        var isCapacitor = !!(window.Capacitor && (typeof window.Capacitor.isNativePlatform === 'function' ? window.Capacitor.isNativePlatform() : window.Capacitor.platform !== 'web'));
        var isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var isFile = window.location.protocol === 'file:' || window.location.protocol === 'capacitor:';
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        var isIframe = false;
        try { isIframe = window.self !== window.top; } catch(e) { isIframe = true; }
        var isCrazyGames = window.location.hostname.indexOf('crazygames') !== -1 || window.location.hostname.indexOf('gamepix') !== -1;
        var isAndroidApp = isCapacitor || isLocalHost || isFile || isStandalone || isIframe || isCrazyGames || /wv|Android.*Version\/[0-9.]+/i.test(navigator.userAgent);

        if (isAndroidApp) {
          var apkBtn = document.getElementById('apk-download-btn');
          if (apkBtn) apkBtn.style.setProperty('display', 'none', 'important');
          var qrBtn = document.getElementById('qr-float-btn');
          if (qrBtn) qrBtn.style.setProperty('display', 'none', 'important');
        }
      }
      detectAndHideOnNative();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', detectAndHideOnNative);
      }
      window.addEventListener('load', detectAndHideOnNative);
    })();

    // Register PWA Service Worker for Offline & Home Screen Install
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('✅ PWA Service Worker Registered:', reg.scope))
          .catch((err) => console.log('PWA Service Worker Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
