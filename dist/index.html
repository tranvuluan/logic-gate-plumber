<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA & Mobile Fullscreen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gate Plumber" />
  <meta name="application-name" content="Logic Gate Plumber" />
  <meta name="theme-color" content="#070e1b" />
  <meta name="description" content="Logic Gate Plumber - Game giải đố xoay cổng logic số trên di động" />

  <!-- App Icons & Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <title>Logic Gate Plumber - Nối Mạch Kỹ Thuật Số</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070e1b;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      image-rendering: auto;
    }
    #apk-download-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 99999;
      background: rgba(0, 255, 157, 0.9);
      color: #070e1b;
      border: 1px solid #00FF9D;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: monospace, sans-serif;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #apk-download-btn:hover {
      background: #FFFFFF;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.9);
      transform: scale(1.05);
    }
    #qr-float-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 99999;
      background: rgba(10, 25, 47, 0.85);
      color: #00F0FF;
      border: 1px solid #00F0FF;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: monospace, sans-serif;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #qr-float-btn:hover {
      background: #00F0FF;
      color: #070e1b;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
      transform: scale(1.05);
    }
    @media (max-width: 600px) {
      #apk-download-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 99999;
      background: rgba(0, 255, 157, 0.9);
      color: #070e1b;
      border: 1px solid #00FF9D;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: monospace, sans-serif;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #apk-download-btn:hover {
      background: #FFFFFF;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.9);
      transform: scale(1.05);
    }
    #qr-float-btn {
        display: none; /* Hide on actual mobile devices */
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DyUePWot.js"></script>
</head>
<body>
  <a id="apk-download-btn" href="./LogicGatePlumber.apk" download="LogicGatePlumber.apk" title="Tải file APK về điện thoại cài đặt">
    ⬇️ Tải file APK (12.3MB)
  </a>
  <a id="qr-float-btn" href="./qr.html" title="Mở trang quét QR để chuyển sang điện thoại">
    📱 Quét mã QR Mobile
  </a>
  <div id="game-container"></div>
  <script>
    // Register PWA Service Worker for Offline & Home Screen Install
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('✅ PWA Service Worker Registered:', reg.scope))
          .catch((err) => console.log('PWA Service Worker Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
