<body>
  <a id="apk-download-btn" href="./LogicGatePlumber-release.apk" download="LogicGatePlumber-release.apk" title="Tải file APK Android Production (Tương thích 100% các dòng máy)">

  <a id="qr-float-btn" href="./qr.html" title="Mở trang quét QR để chuyển sang điện thoại">
    📱 Quét mã QR Mobile
  </a>
  <div id="game-container"></div>
  <script>
    // Hide APK download button and QR button if running inside native Android App (Capacitor) or standalone mode
    (function() {
      function detectAndHideOnNative() {
        var isCapacitor = !!(window.Capacitor && (typeof window.Capacitor.isNativePlatform === 'function' ? window.Capacitor.isNativePlatform() : window.Capacitor.platform !== 'web'));
        var isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var isFile = window.location.protocol === 'file:' || window.location.protocol === 'capacitor:';
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        var isAndroidApp = isCapacitor || isLocalHost || isFile || isStandalone || /wv|Android.*Version\/[0-9.]+/i.test(navigator.userAgent);

        if (isAndroidApp) {
          var apkBtn = document.getElementById('apk-download-btn');
          if (apkBtn) apkBtn.style.setProperty('display', 'none', 'important');
          var qrBtn = document.getElementById('qr-float-btn');
          if (qrBtn) qrBtn.style.setProperty('display', 'none', 'important');
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', detectAndHideOnNative);
      } else {
        detectAndHideOnNative();
      }
      window.addEventListener('load', detectAndHideOnNative);
    })();

    // Register PWA Service Worker for Offline & Home Screen Install
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('✅ PWA Service Worker Registered:', reg.scope))
          .catch((err) => console.log('PWA Service Worker Registration Failed:', err));
      });
    }
  </script>
